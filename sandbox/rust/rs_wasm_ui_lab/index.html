<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Throwaway Rust/WebAssembly canvas UI experiment">
  <title>Rust/Wasm Canvas Workbench</title>
  <link data-trunk rel="rust" data-wasm-opt="z">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0d12; }
    body { overscroll-behavior: none; }
    .a11y-mirror {
      position: fixed;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body></body>
</html>
