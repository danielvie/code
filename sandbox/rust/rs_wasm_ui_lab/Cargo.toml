[package]
name = "wasm-ui-lab"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
regex = { version = "1.12", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
unicode-segmentation = "1.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DragEvent",
    "DataTransfer",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "Performance",
    "PointerEvent",
    "TextMetrics",
    "WheelEvent",
    "Window",
] }
