version: '3'

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  run:
    desc: Run the GPUI counter
    cmds:
      - cargo run

  test:
    desc: Check the app and run tests
    cmds:
      - cargo check
      - cargo test

  clear:
    desc: Remove build artifacts
    cmds:
      - cargo clean
