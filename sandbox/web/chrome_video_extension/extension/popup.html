<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson video saver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Lesson videos</h1>
    <button id="scan" type="button">Scan videos</button>
  </header>
  <main>
    <p id="status" role="status" aria-live="polite">Start playback, then scan this page.</p>
    <ul id="videos" class="video-list" aria-label="Detected videos"></ul>
  </main>
  <footer>Saves to your browser's download folder using the original filename.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
