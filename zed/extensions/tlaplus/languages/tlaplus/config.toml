name = "TLA+"
grammar = "tlaplus"
path_suffixes = ["tla"]
line_comments = ["\\* "]
block_comment = { start = "(*", end = "*)", prefix = "", tab_size = 1 }
tab_size = 4
hard_tabs = false
increase_indent_pattern = "(==|≜)\\s*$"
brackets = [
    { start = "{", end = "}", close = true, surround = true, newline = true, not_in = ["string", "comment"] },
    { start = "[", end = "]", close = true, surround = true, newline = true, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, surround = true, newline = true, not_in = ["string", "comment"] },
    { start = "<<", end = ">>", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
    { start = "⟨", end = "⟩", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
    { start = "〈", end = "〉", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
]
