version: '3'

tasks:
  default:
    cmds:
      - task --list

  run:
    aliases: [r]
    desc: Run the diagram PoC
    cmds:
      - cargo run

  dev:
    desc: Rebuild and restart on code changes, restoring the autosaved diagram
    cmds:
      - python -u scripts/dev.py

  counter:
    desc: Run the original counter and drag/drop learning example
    cmds:
      - cargo run --example counter

  check:
    desc: Type-check without building an executable
    cmds:
      - cargo check

  fmt:
    desc: Format Rust source
    cmds:
      - cargo fmt
